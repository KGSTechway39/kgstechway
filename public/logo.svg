<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KGSTechway Services">
  <title>KGSTechway Services — Pathway Symbol</title>
  <!--
    Bold circular badge. Weights are tuned so the mark still reads at 16px:
    thick strokes, large anchor dots, a straight middle path and a solid arrow.
  -->
  <defs>
    <linearGradient id="kgt-arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#E2622A"/>
    </linearGradient>
  </defs>

  <!-- Dark circular background -->
  <circle cx="32" cy="32" r="32" fill="#0D0D0D"/>

  <!-- Converging pathways: top and bottom curve in, middle runs straight -->
  <path d="M 17,17.5 C 30,17.5 34,26 44.5,26.5"
        stroke="#E74C3C" stroke-width="4.4" fill="none" stroke-linecap="round"/>
  <path d="M 17,32 L 45,32"
        stroke="#E67E22" stroke-width="4.4" fill="none" stroke-linecap="round"/>
  <path d="M 17,46.5 C 30,46.5 34,38 44.5,37.5"
        stroke="#F1C40F" stroke-width="4.4" fill="none" stroke-linecap="round"/>

  <!-- Origin anchor dots -->
  <circle cx="17" cy="17.5" r="5.2" fill="#E74C3C"/>
  <circle cx="17" cy="32"   r="5.2" fill="#E67E22"/>
  <circle cx="17" cy="46.5" r="5.2" fill="#F1C40F"/>

  <!-- Convergence arrow -->
  <polygon points="43.5,22.5 57,32 43.5,41.5" fill="url(#kgt-arrow)"/>
</svg>
